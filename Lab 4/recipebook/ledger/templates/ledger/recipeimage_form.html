{% extends "base.html" %}

{% block page_heading %}Add Image{% endblock %}

{% block content %}
  <p>Upload an image for <strong>{{ recipe.name }}</strong>.</p>

  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload Image</button>
  </form>

  <p><a href="{{ recipe.get_absolute_url }}">Back to recipe</a></p>
{% endblock %}
